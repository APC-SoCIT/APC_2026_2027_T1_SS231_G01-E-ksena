name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        git remote add space https://4rima:$HF_TOKEN@huggingface.co/spaces/4rima/emergency-ai-detector HEAD:AI
        git fetch space main
        git rebase space/main || git merge space/main --allow-unrelated-histories -m "Sync HF Space"
        git push space main
