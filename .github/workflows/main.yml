name: Pull from Hugging Face Space and Push to GitHub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: "4rima"
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is not set" >&2
            exit 1
          fi

          # mask the token so it never appears in logs even if something echoes it
          echo "::add-mask::$HF_TOKEN"

          git lfs install --local

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SPACE_URL="https://huggingface.co/spaces/4rima/emergency-ai-detector"

          git remote remove space 2>/dev/null || true
          git remote add space "$SPACE_URL"

          # credentials go through a credential helper instead of the URL or a
          # hand-built header, so we don't have to get the auth scheme exactly right
          git config --local credential."https://huggingface.co".helper \
            '!f() { echo "username=${HF_USERNAME}"; echo "password=${HF_TOKEN}"; }; f'

          git fetch space main
          git lfs fetch space main || true

          if git merge-base --is-ancestor space/main HEAD; then
            echo "Already up to date with the Space; nothing to do."
            exit 0
          fi

          git merge space/main \
            --allow-unrelated-histories \
            --no-edit \
            -m "Sync main branch from Hugging Face Space"

          git push origin HEAD:AI
