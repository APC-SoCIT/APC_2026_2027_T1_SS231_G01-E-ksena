name: Sync from Hugging Face hub to Git AI branch

on:
  schedule:
    - cron: "*/15 * * * *"   # adjust interval here
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-hf-to-ai
  cancel-in-progress: false

jobs:
  sync-from-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          ref: AI
          fetch-depth: 0
          lfs: true

      - name: Pull from Hugging Face Space and Push to GitHub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: "4rima"
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is not set" >&2
            exit 1
          fi

          echo "::add-mask::$HF_TOKEN"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SPACE_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/4rima/emergency-ai-detector.git"

          rm -rf /tmp/hf-space
          git clone --depth 1 "$SPACE_URL" /tmp/hf-space

          rsync -a --delete \
            --exclude='.git' \
            /tmp/hf-space/ ./

          git add -A

          if git diff --cached --quiet; then
            echo "No changes from the Space; nothing to commit."
            exit 0
          fi

          git commit -m "Sync from Hugging Face Space [skip ci]"
          git push origin HEAD:AI
