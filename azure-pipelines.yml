# ============================================================
# E-ksena CI/CD Pipeline
# Repo   : APC-SoCIT/APC_2026_2027_T1_SS231_G01-E-ksena
# Branch : Web-app  (all source code lives here, NOT in main)
# Agent  : Self-hosted on Windows Server 2025 VM via RDP
# Target : IIS on the same VM
# ============================================================

trigger:
  branches:
    include:
      - Web-app

pool:
  name: 'E-ksena.Staging'

variables:
  NODE_VERSION: '20.x'
  BACKEND_DIR:  'E-ksena_Backend'
  FRONTEND_DIR: 'E-ksena-webapp-all-files'
  IIS_SITE_PATH: 'C:\inetpub\wwwroot\E-ksena'
  ARTIFACT_NAME: 'drop'

# ===========================================================
# STAGE 1 - Build
# ===========================================================
stages:
- stage: Build
  displayName: 'Build Web App'
  jobs:
  - job: BuildJob
    displayName: 'Install, Build and Archive'
    # Raised from 60 → 90 min. The Expo install+build on a cold VM
    # can take 30–50 min on first run; caching below will cut this
    # significantly on subsequent runs.
    timeoutInMinutes: 90
    # CRITICAL: Use 'workspace: clean: all' instead of letting the
    # checkout task run 'git clean -ffdx'. The root package.json has
    # name='e-ksena-workspace', so npm creates a self-referential
    # symlink: node_modules/e-ksena-workspace -> ../ which causes
    # git clean to recurse infinitely and hang the entire job.
    # 'workspace: clean: all' wipes $(Agent.BuildDirectory) outright,
    # bypassing git's directory traversal entirely.
    workspace:
      clean: all
    steps:

    # ----------------------------------------------------------
    # 1. Checkout — shallow clone (depth 1) to speed up fetch.
    #    The system decorator tried fetchDepth:1 but wasn't
    #    applied because the job didn't declare checkout explicitly.
    #    Declaring it here makes it take effect reliably.
    # ----------------------------------------------------------
    - checkout: self
      fetchDepth: 1
      lfs: false
      # clean: false because workspace: clean: all above already
      # wiped the directory — running git clean again is redundant
      # and risks the infinite symlink loop.
      clean: false
      displayName: 'Checkout repository (shallow)'

    # ----------------------------------------------------------
    # 2. Install Node.js
    # ----------------------------------------------------------
    - task: NodeTool@0
      inputs:
        versionSpec: '$(NODE_VERSION)'
      displayName: 'Install Node.js $(NODE_VERSION)'

    # ----------------------------------------------------------
    # 3a. Install root dependencies
    # ----------------------------------------------------------
    - script: npm install
      workingDirectory: '$(System.DefaultWorkingDirectory)'
      displayName: 'Install root dependencies'

    # ----------------------------------------------------------
    # 3b. Install backend dependencies
    # ----------------------------------------------------------
    - script: npm install
      workingDirectory: '$(System.DefaultWorkingDirectory)\$(BACKEND_DIR)'
      displayName: 'Install backend dependencies'

    # ----------------------------------------------------------
    # 3c. Install frontend dependencies + verify expo binary
    #     Each script step is a fresh cmd.exe invocation with its
    #     own workingDirectory — 100% reliable on Windows.
    # ----------------------------------------------------------
    - script: |
        echo Installing frontend dependencies...
        npm install
        echo.
        echo === Verifying expo binary was installed ===
        if not exist "node_modules\.bin\expo.cmd" (
          echo ERROR: expo.cmd was NOT installed
          echo Contents of node_modules\.bin:
          dir node_modules\.bin\ /b 2>nul | findstr /i expo || echo no expo files found
          exit /b 1
        )
        echo OK: expo.cmd found
      workingDirectory: '$(System.DefaultWorkingDirectory)\$(FRONTEND_DIR)'
      displayName: 'Install frontend dependencies + verify expo'

    # ----------------------------------------------------------
    # 4. Build Expo web frontend
    #    Direct .cmd shim call — workingDirectory guarantees we
    #    are in the frontend project root where expo is installed.
    # ----------------------------------------------------------
    - script: node_modules\.bin\expo.cmd export --platform web
      workingDirectory: '$(System.DefaultWorkingDirectory)\$(FRONTEND_DIR)'
      displayName: 'Build Expo web frontend (expo export --platform web)'
      env:
        EXPO_PUBLIC_SUPABASE_URL: $(EXPO_PUBLIC_SUPABASE_URL)
        EXPO_PUBLIC_SUPABASE_ANON_KEY: $(EXPO_PUBLIC_SUPABASE_ANON_KEY)
        EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: $(EXPO_PUBLIC_GOOGLE_MAPS_API_KEY)

    # ----------------------------------------------------------
    # 8. Archive only the dist/ output for IIS
    # ----------------------------------------------------------
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)\$(FRONTEND_DIR)\dist'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive build output (dist/ only)'

    # ----------------------------------------------------------
    # 9. Publish artifact
    # ----------------------------------------------------------
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: '$(ARTIFACT_NAME)'
        publishLocation: 'Container'
      displayName: 'Publish artifact to pipeline'

# ===========================================================
# STAGE 2 - Deploy to IIS on Windows Server VM
# ===========================================================
- stage: Deploy
  displayName: 'Deploy to IIS on Windows VM'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToIIS
    displayName: 'Deploy to IIS'
    environment: 'E-ksena-Staging'
    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: '$(ARTIFACT_NAME)'
              downloadPath: '$(System.ArtifactsDirectory)'
            displayName: 'Download build artifact'

          - task: PowerShell@2
            displayName: 'Stop IIS Site, Deploy Files, Restart IIS Site'
            inputs:
              targetType: 'inline'
              errorActionPreference: 'Continue'
              failOnStderr: false
              script: |
                $zipPath    = "$(System.ArtifactsDirectory)\$(ARTIFACT_NAME)\$(Build.BuildId).zip"
                $deployPath = "$(IIS_SITE_PATH)"
                $siteName   = "E-ksena"

                Import-Module WebAdministration -ErrorAction SilentlyContinue

                # -------------------------------------------------------
                # Stop the E-ksena IIS site (not the whole W3SVC service).
                # Stop-WebSite only requires IIS management rights, not
                # full SCM elevation like Stop-Service W3SVC does.
                # -------------------------------------------------------
                Write-Host "--- Stopping IIS site '$siteName' ---"
                try {
                    Stop-WebSite -Name $siteName -ErrorAction Stop
                    Write-Host "Site '$siteName' stopped."
                } catch {
                    Write-Warning "Could not stop site: $_  Continuing anyway."
                }

                # -------------------------------------------------------
                # Ensure deploy directory and grant agent FullControl.
                # -------------------------------------------------------
                Write-Host "--- Ensuring deployment directory exists ---"
                if (-not (Test-Path $deployPath)) {
                    New-Item -ItemType Directory -Path $deployPath -Force
                    Write-Host "Created: $deployPath"
                }
                try {
                    $acl  = Get-Acl $deployPath
                    $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
                        [System.Security.Principal.WindowsIdentity]::GetCurrent().Name,
                        "FullControl", "ContainerInherit,ObjectInherit", "None", "Allow"
                    )
                    $acl.SetAccessRule($rule)
                    Set-Acl $deployPath $acl
                    Write-Host "ACL updated for current agent account."
                } catch {
                    Write-Warning "Could not set ACL: $_"
                }

                # -------------------------------------------------------
                # Clean old files and extract new build.
                # -------------------------------------------------------
                Write-Host "--- Cleaning old deployment files ---"
                Remove-Item "$deployPath\*" -Recurse -Force -ErrorAction SilentlyContinue

                Write-Host "--- Extracting $zipPath to $deployPath ---"
                Expand-Archive -Path $zipPath -DestinationPath $deployPath -Force
                Write-Host "Extraction complete."

                # -------------------------------------------------------
                # Copy web.config for SPA routing (committed in repo at
                # E-ksena-webapp-all-files/web.config).
                # Sets index.html as default document and rewrites all
                # unknown paths to index.html for Expo Router routing.
                # -------------------------------------------------------
                Write-Host "--- Copying web.config for SPA routing ---"
                $webConfigSrc = "$(System.DefaultWorkingDirectory)\$(FRONTEND_DIR)\web.config"
                if (Test-Path $webConfigSrc) {
                    Copy-Item $webConfigSrc "$deployPath\web.config" -Force
                    Write-Host "web.config copied from repo."
                } else {
                    Write-Warning "web.config not found at $webConfigSrc — SPA deep links may 404."
                }

                # -------------------------------------------------------
                # Ensure IIS URL Rewrite module is available (needed for
                # the SPA rewrite rule above). Log a warning if missing.
                # -------------------------------------------------------
                $rewriteDll = "$env:SystemRoot\System32\inetsrv\rewrite.dll"
                if (-not (Test-Path $rewriteDll)) {
                    Write-Warning "IIS URL Rewrite module not found at $rewriteDll"
                    Write-Warning "Download and install from: https://www.iis.net/downloads/microsoft/url-rewrite"
                    Write-Warning "Without it the SPA fallback rule will be ignored (404 on deep links)."
                }

                # -------------------------------------------------------
                # Start the E-ksena IIS site.
                # -------------------------------------------------------
                Write-Host "--- Starting IIS site '$siteName' ---"
                try {
                    Start-WebSite -Name $siteName -ErrorAction Stop
                    Write-Host "Site '$siteName' started."
                } catch {
                    Write-Warning "Could not start site: $_"
                    Write-Warning "Start the '$siteName' site manually in IIS Manager."
                }

                Write-Host "--- Deployment complete. Files at: $deployPath ---"


          - task: PowerShell@2
            displayName: 'Verify Deployment'
            inputs:
              targetType: 'inline'
              script: |
                # Check W3SVC (IIS) is running
                $svc = Get-Service -Name W3SVC -ErrorAction SilentlyContinue
                if ($null -eq $svc) {
                    Write-Warning "W3SVC service not found. IIS may not be installed."
                } else {
                    Write-Host "IIS (W3SVC) status: $($svc.Status)"
                }

                # Check deployed files exist
                $deployPath  = "$(IIS_SITE_PATH)"
                $indexFile   = "$deployPath\index.html"
                $webConfig   = "$deployPath\web.config"

                if (Test-Path $indexFile) {
                    Write-Host "OK: index.html found at $indexFile"
                } else {
                    Write-Warning "index.html NOT found at $indexFile - deployment may have failed."
                }

                if (Test-Path $webConfig) {
                    Write-Host "OK: web.config found at $webConfig"
                } else {
                    Write-Warning "web.config NOT found at $webConfig - SPA routing may not work."
                }

                Write-Host "Deployment verification complete."




